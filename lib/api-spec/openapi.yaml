openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Role-Based Approval & Workflow Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User management
  - name: requests
    description: Approval requests
  - name: workflows
    description: Workflow templates
  - name: comments
    description: Request comments
  - name: notifications
    description: User notifications
  - name: audit
    description: Audit log
  - name: dashboard
    description: Dashboard analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  # Users
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: department
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /users/departments:
    get:
      operationId: getDepartments
      tags: [users]
      summary: List all departments
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  # Requests
  /requests:
    get:
      operationId: listRequests
      tags: [requests]
      summary: List all requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: submittedBy
          in: query
          schema:
            type: integer
        - name: assignedTo
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestList"
    post:
      operationId: createRequest
      tags: [requests]
      summary: Create a new request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestInput"
      responses:
        "201":
          description: Created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"

  /requests/{requestId}:
    get:
      operationId: getRequest
      tags: [requests]
      summary: Get request by ID
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request details with approval steps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"
        "404":
          description: Not found
    patch:
      operationId: updateRequest
      tags: [requests]
      summary: Update request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUpdate"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
    delete:
      operationId: deleteRequest
      tags: [requests]
      summary: Delete request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /requests/{requestId}/approve:
    post:
      operationId: approveRequest
      tags: [requests]
      summary: Approve a request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalAction"
      responses:
        "200":
          description: Approval step updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalStep"

  /requests/{requestId}/reject:
    post:
      operationId: rejectRequest
      tags: [requests]
      summary: Reject a request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalAction"
      responses:
        "200":
          description: Approval step updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalStep"

  # Workflow Templates
  /workflow-templates:
    get:
      operationId: listWorkflowTemplates
      tags: [workflows]
      summary: List all workflow templates
      responses:
        "200":
          description: List of workflow templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowTemplate"
    post:
      operationId: createWorkflowTemplate
      tags: [workflows]
      summary: Create workflow template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowTemplateInput"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTemplate"

  /workflow-templates/{templateId}:
    get:
      operationId: getWorkflowTemplate
      tags: [workflows]
      summary: Get workflow template by ID
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Workflow template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTemplate"
    patch:
      operationId: updateWorkflowTemplate
      tags: [workflows]
      summary: Update workflow template
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowTemplateUpdate"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTemplate"
    delete:
      operationId: deleteWorkflowTemplate
      tags: [workflows]
      summary: Delete workflow template
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Comments
  /requests/{requestId}/comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List comments on a request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [comments]
      summary: Add comment to request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /requests/{requestId}/comments/{commentId}:
    delete:
      operationId: deleteComment
      tags: [comments]
      summary: Delete comment
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Notifications
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current user
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{notificationId}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/mark-all-read:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: All marked read

  # Audit Log
  /audit-log:
    get:
      operationId: listAuditLog
      tags: [audit]
      summary: List audit log entries
      parameters:
        - name: requestId
          in: query
          schema:
            type: integer
        - name: userId
          in: query
          schema:
            type: integer
        - name: action
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogList"

  # Dashboard
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Recent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/request-breakdown:
    get:
      operationId: getRequestBreakdown
      tags: [dashboard]
      summary: Get request status breakdown
      responses:
        "200":
          description: Request breakdown by status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequestBreakdown"

  /dashboard/approval-pipeline:
    get:
      operationId: getApprovalPipeline
      tags: [dashboard]
      summary: Get pending approvals pipeline for current user
      responses:
        "200":
          description: Pending items in approval pipeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PipelineItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # Auth
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RegisterInput:
      type: object
      required: [name, email, password, role, department]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [super_admin, admin, manager, employee]
        department:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    # User
    User:
      type: object
      required: [id, name, email, role, department, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_admin, admin, manager, employee]
        department:
          type: string
        avatarUrl:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_admin, admin, manager, employee]
        department:
          type: string
        isActive:
          type: boolean

    # Request
    Request:
      type: object
      required: [id, title, type, status, priority, submittedById, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        type:
          type: string
          enum: [leave, expense, procurement, it_access, hr_policy, other]
        status:
          type: string
          enum: [draft, pending, in_review, approved, rejected, cancelled]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        submittedById:
          type: integer
        submittedBy:
          $ref: "#/components/schemas/User"
        assignedToId:
          type: ["integer", "null"]
        assignedTo:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        workflowTemplateId:
          type: ["integer", "null"]
        currentStepOrder:
          type: ["integer", "null"]
        totalSteps:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    RequestDetail:
      allOf:
        - $ref: "#/components/schemas/Request"
        - type: object
          properties:
            approvalSteps:
              type: array
              items:
                $ref: "#/components/schemas/ApprovalStep"
            comments:
              type: array
              items:
                $ref: "#/components/schemas/Comment"
            auditLog:
              type: array
              items:
                $ref: "#/components/schemas/AuditLogEntry"

    RequestList:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Request"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    RequestInput:
      type: object
      required: [title, type, priority]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        type:
          type: string
          enum: [leave, expense, procurement, it_access, hr_policy, other]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        workflowTemplateId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]

    RequestUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [leave, expense, procurement, it_access, hr_policy, other]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        status:
          type: string
          enum: [draft, pending, in_review, approved, rejected, cancelled]
        assignedToId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]

    # Approval
    ApprovalStep:
      type: object
      required: [id, requestId, stepOrder, approverRole, status, createdAt]
      properties:
        id:
          type: integer
        requestId:
          type: integer
        stepOrder:
          type: integer
        approverRole:
          type: string
        approverId:
          type: ["integer", "null"]
        approver:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        status:
          type: string
          enum: [pending, approved, rejected, skipped]
        comment:
          type: ["string", "null"]
        decidedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    ApprovalAction:
      type: object
      properties:
        comment:
          type: string

    # Workflow Template
    WorkflowTemplate:
      type: object
      required: [id, name, requestType, steps, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        requestType:
          type: string
        isActive:
          type: boolean
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStep"
        createdAt:
          type: string
        updatedAt:
          type: string

    WorkflowStep:
      type: object
      required: [stepOrder, approverRole, label]
      properties:
        stepOrder:
          type: integer
        approverRole:
          type: string
        label:
          type: string
        isRequired:
          type: boolean

    WorkflowTemplateInput:
      type: object
      required: [name, requestType, steps]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        requestType:
          type: string
        isActive:
          type: boolean
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStep"

    WorkflowTemplateUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        requestType:
          type: string
        isActive:
          type: boolean
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStep"

    # Comment
    Comment:
      type: object
      required: [id, requestId, userId, text, createdAt]
      properties:
        id:
          type: integer
        requestId:
          type: integer
        userId:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        text:
          type: string
        createdAt:
          type: string

    CommentInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1

    # Notification
    Notification:
      type: object
      required: [id, userId, message, isRead, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        message:
          type: string
        type:
          type: string
          enum: [approval_needed, status_changed, comment_added, assigned, system]
        isRead:
          type: boolean
        requestId:
          type: ["integer", "null"]
        createdAt:
          type: string

    # Audit Log
    AuditLogEntry:
      type: object
      required: [id, action, performedById, createdAt]
      properties:
        id:
          type: integer
        requestId:
          type: ["integer", "null"]
        action:
          type: string
        performedById:
          type: integer
        performedBy:
          $ref: "#/components/schemas/User"
        details:
          type: ["string", "null"]
        createdAt:
          type: string

    AuditLogList:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # Dashboard
    DashboardStats:
      type: object
      required: [totalRequests, pendingRequests, approvedRequests, rejectedRequests, myPendingApprovals, totalUsers, requestsThisMonth, avgApprovalTimeHours]
      properties:
        totalRequests:
          type: integer
        pendingRequests:
          type: integer
        approvedRequests:
          type: integer
        rejectedRequests:
          type: integer
        myPendingApprovals:
          type: integer
        totalUsers:
          type: integer
        requestsThisMonth:
          type: integer
        avgApprovalTimeHours:
          type: number

    ActivityItem:
      type: object
      required: [id, action, description, createdAt]
      properties:
        id:
          type: integer
        action:
          type: string
        description:
          type: string
        requestId:
          type: ["integer", "null"]
        requestTitle:
          type: ["string", "null"]
        performedBy:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        createdAt:
          type: string

    RequestBreakdown:
      type: object
      required: [status, count, percentage]
      properties:
        status:
          type: string
        count:
          type: integer
        percentage:
          type: number

    PipelineItem:
      type: object
      required: [requestId, requestTitle, requestType, priority, submittedBy, submittedAt, stepOrder, totalSteps]
      properties:
        requestId:
          type: integer
        requestTitle:
          type: string
        requestType:
          type: string
        priority:
          type: string
        submittedBy:
          $ref: "#/components/schemas/User"
        submittedAt:
          type: string
        stepOrder:
          type: integer
        totalSteps:
          type: integer
        dueDate:
          type: ["string", "null"]
