kind = "web"
previewPath = "/"
title = "Workflow Management System"
version = "1.0.0"
id = "artifacts/workflow-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22115

[services.development]
run = "pnpm --filter @workspace/workflow-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/workflow-app", "run", "build" ]
publicDir = "artifacts/workflow-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22115"
BASE_PATH = "/"
